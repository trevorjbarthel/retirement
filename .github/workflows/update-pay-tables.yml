name: Update pay tables

# Regenerates the committed DFAS pay tables and opens a PR for review.
# Runs on demand, and in January when the new year's tables are published.
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Pay year to fetch (defaults to current year)"
        required: false
        default: ""
  schedule:
    - cron: "0 12 5 1 *"   # Jan 5
    - cron: "0 12 20 1 *"  # Jan 20 (catch late publication)

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The dispatch input is passed through an env var and validated, NOT interpolated
      # straight into the shell. `${{ github.event.inputs.year }}` is attacker-influenced
      # text expanded into a script in a job that holds `contents: write` — a classic
      # script-injection sink. The env indirection means the value is data, never syntax.
      - name: Validate year input
        env:
          YEAR_INPUT: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$YEAR_INPUT" ] && ! printf '%s' "$YEAR_INPUT" | grep -Eq '^[0-9]{4}$'; then
            echo "::error::year must be a 4-digit year (got: $YEAR_INPUT)"
            exit 1
          fi
      - name: Regenerate pay tables from DFAS
        env:
          YEAR_INPUT: ${{ github.event.inputs.year }}
        run: node scripts/update-pay-tables.mjs --year "$YEAR_INPUT" --write --strict
      - name: Run tests
        run: npm test
      - name: Open PR with refreshed tables
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh DFAS basic-pay tables"
          branch: bot/pay-tables-refresh
          title: "Refresh DFAS basic-pay tables"
          body: |
            Automated regeneration of the basic-pay tables from the official DFAS pages.

            **Review the numbers in `public/data/pay-tables.json` before merging.**

            The UI's "as of" label is derived from `PAY_TABLES`' own year keys
            (`PAY_TABLE_YEAR` in `calc.js`), so it follows this data automatically — there is
            no separate label to update by hand, which is why `add-paths` can stay narrow.
          add-paths: |
            public/js/pay-tables.generated.js
            public/data/pay-tables.json
